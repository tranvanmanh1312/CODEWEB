<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Меню Vietnamese Station для сборки бизнес-ланча."
    >
    <title>Собрать ланч — Vietnamese Station</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin="anonymous"
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="lunch.css">
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>VIETNAMESE STATION</h1>
            <nav class="main-nav">
                <a href="index.html">О нас</a>
                <a class="active" href="lunch.html">Собрать ланч</a>
                <a href="order.html">Оформить заказ</a>
                <a href="orders.html">Заказы</a>
                <a href="#contacts">Контакты</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="menu-section">
            <h2>Выберите суп</h2>
            <div class="filters" data-category="soup">
                <button type="button" data-kind="fish">Рыбный</button>
                <button type="button" data-kind="meat">Мясной</button>
                <button type="button" data-kind="veg">
                    Вегетарианский
                </button>
            </div>
            <div class="dishes-grid" id="soups"></div>
        </section>

        <section class="menu-section">
            <h2>Выберите главное блюдо</h2>
            <div class="filters" data-category="main">
                <button type="button" data-kind="fish">Рыбное</button>
                <button type="button" data-kind="meat">Мясное</button>
                <button type="button" data-kind="veg">
                    Вегетарианское
                </button>
            </div>
            <div class="dishes-grid" id="main-courses"></div>
        </section>

        <section class="menu-section">
            <h2>Выберите салат или стартер</h2>
            <div class="filters" data-category="salad">
                <button type="button" data-kind="fish">Рыбный</button>
                <button type="button" data-kind="meat">Мясной</button>
                <button type="button" data-kind="veg">
                    Вегетарианский
                </button>
            </div>
            <div class="dishes-grid" id="salads"></div>
        </section>

        <section class="menu-section">
            <h2>Выберите напиток</h2>
            <div class="filters" data-category="drink">
                <button type="button" data-kind="cold">Холодный</button>
                <button type="button" data-kind="hot">Горячий</button>
            </div>
            <div class="dishes-grid" id="drinks"></div>
        </section>

        <section class="menu-section">
            <h2>Выберите десерт</h2>
            <div class="filters" data-category="dessert">
                <button type="button" data-kind="small">
                    Маленькая порция
                </button>
                <button type="button" data-kind="medium">
                    Средняя порция
                </button>
                <button type="button" data-kind="large">
                    Большая порция
                </button>
            </div>
            <div class="dishes-grid" id="desserts"></div>
        </section>
        <aside
            id="checkout-panel"
            class="checkout-panel hidden"
        >
            <div class="checkout-panel-total">
                <span>Стоимость заказа</span>
                <strong>
                    <span id="checkout-total">0</span> ₽
                </strong>
            </div>
            <a
                id="checkout-link"
                class="checkout-link disabled"
                aria-disabled="true"
            >
                Перейти к оформлению
            </a>
        </aside>
    </main>

    <footer id="contacts">
        <div class="container">
            <p>
                Позвонить нам:
                <a href="tel:+74951234567">
                    +7 (495) 123-45-67
                </a>
            </p>
        </div>
    </footer>

    <script src="dishes.js"></script>
    <script src="storage.js"></script>
    <script src="combo.js"></script>
    <script src="script.js"></script>
</body>
</html>
